[run]
# The digest runs weekly, but arXiv announces a paper up to ~3 days after its submission date
# (a late-Friday submission is listed Monday night), so the window reaches well past the
# previous run; state/seen.json keeps the overlap from showing a paper twice.
window_days = 14         # rolling window of submission dates
cap = 250                # max candidates handed to the model per run (newest kept)
seen_keep_days = 60      # prune state/seen.json entries older than this
timezone = "Europe/Moscow"

[site]
# Used for the Atom feed and the per-paper feedback links (prefilled GitHub issues).
url = "https://focix.github.io/quantum-optics-digest/"
repo = "Focix/quantum-optics-digest"

[arxiv]
max_results = 200
delay_seconds = 5             # pause between arXiv requests (a run makes one per pool)
# Short on purpose: a throttled pool falls back to OpenAlex (see [backup]) rather than
# waiting arXiv out. A throttled arXiv answers slowly, so the timeout matters more than
# the backoff does; together these bound a fully-throttled run at roughly two minutes.
timeout_seconds = 20          # a throttled arXiv can sit on a 429 for 15s+
retries = 2                   # extra attempts on 429 / 503 / network errors
retry_wait_seconds = 5        # first backoff; doubles each attempt, +/-25% jitter
retry_max_wait_seconds = 30   # cap on the backoff, and on any Retry-After arXiv sends

[backup]
# When a pool's arXiv fetch fails, refill it from OpenAlex using the pool's backup_query.
# OpenAlex indexes preprints days late, so the digest is thinner and the page says so.
enabled = true

[citations]
# Citation counts and venues from OpenAlex (api.openalex.org, no key). Add the host
# to the cloud environment's allowed domains. The `mailto` puts requests in OpenAlex's
# polite pool, which is throttled far less than the common pool an empty value uses
# (an empty one 429'd the whole lookup on 2026-09-16).
enabled = true
mailto = "fdmiester@gmail.com"
# Each render retries the counts earlier runs missed, over digests this many days back.
# Papers go uncounted when OpenAlex throttles a run or has not indexed the preprint yet;
# both clear up within days, and nothing else ever revisits a published digest.
backfill_days = 30

[journal]
# Journal articles with no arXiv version, found through OpenAlex and ranked with the
# computing papers. Needs [citations] enabled; deduplicated against state/seen.json.
query = '"superconducting qubit" OR transmon OR fluxonium'
lookback_days = 14
