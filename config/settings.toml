[run]
window_days = 7          # rolling window of submission dates
cap = 120                # max candidates handed to the model per run (newest kept)
seen_keep_days = 60      # prune state/seen.json entries older than this
timezone = "Europe/Moscow"

[arxiv]
max_results = 200
delay_seconds = 3        # pause between arXiv requests
retries = 3              # extra attempts on 503 / network errors
retry_wait_seconds = 10

[s2]
# Semantic Scholar enrichment. Off until the API key is provisioned as an
# environment credential on the cloud routine (host api.semanticscholar.org,
# header x-api-key). Locally, export S2_API_KEY to send the header yourself.
enabled = false

[weekly]
lookback_days = 7        # daily digests to pull computing-tagged papers from
s2_search_query = '"superconducting qubit" | transmon | fluxonium'
s2_lookback_days = 14
