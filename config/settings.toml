[run]
window_days = 7          # rolling window of submission dates
cap = 120                # max candidates handed to the model per run (newest kept)
seen_keep_days = 60      # prune state/seen.json entries older than this
timezone = "Europe/Moscow"

[site]
# Used for the Atom feed and the per-paper feedback links (prefilled GitHub issues).
url = "https://focix.github.io/quantum-optics-digest/"
repo = "Focix/quantum-optics-digest"

[arxiv]
max_results = 200
delay_seconds = 3        # pause between arXiv requests
retries = 3              # extra attempts on 503 / network errors
retry_wait_seconds = 10

[citations]
# Citation counts and venues from OpenAlex (api.openalex.org, no key). Add the host
# to the cloud environment's allowed domains. An email in `mailto` puts requests
# in OpenAlex's polite pool; leave empty to use the common pool.
enabled = true
mailto = ""

[weekly]
lookback_days = 7        # daily digests to pull computing-tagged papers from
journal_search_query = '"superconducting qubit" OR transmon OR fluxonium'
journal_lookback_days = 14
