# arXiv queries, one per pool. Categories are OR'ed and AND'ed with the query.
# Broad on purpose: exclusion is the ranking model's job.
#
# backup_query is the same intent in OpenAlex's search syntax, used only when
# export.arxiv.org is unreachable. OpenAlex has no category filter and indexes
# preprints days late, so it is a reduced version of the pool, not a translation.

[pools.A]
label = "Superconducting artificial atoms (also the weekly computing pool)"
categories = ["quant-ph", "cond-mat.mes-hall", "cond-mat.supr-con"]
query = '''abs:"superconducting qubit" OR (abs:superconducting AND abs:qubit) OR abs:"superconducting circuit" OR abs:"superconducting resonator" OR abs:transmon OR abs:fluxonium OR abs:"circuit QED" OR abs:"circuit quantum electrodynamics" OR abs:"artificial atom" OR abs:"microwave photon" OR abs:"Josephson junction"'''
backup_query = '''"superconducting qubit" OR "superconducting circuit" OR "superconducting resonator" OR transmon OR fluxonium OR "circuit QED" OR "circuit quantum electrodynamics" OR "artificial atom" OR "microwave photon" OR "Josephson junction"'''

[pools.B]
label = "Quantum optics on other platforms"
categories = ["quant-ph", "physics.optics", "physics.atom-ph"]
query = '''abs:"cavity QED" OR abs:"waveguide QED" OR abs:"single photon" OR abs:"single-photon" OR abs:"photon statistics" OR abs:"resonance fluorescence" OR abs:"squeezed light" OR abs:"quantum emitter" OR abs:"giant atom" OR abs:optomechanical OR (abs:Rydberg AND abs:photon) OR (abs:"trapped ion" AND abs:photon) OR (abs:"quantum dot" AND abs:photon)'''
backup_query = '''"cavity QED" OR "waveguide QED" OR "single photon" OR "photon statistics" OR "resonance fluorescence" OR "squeezed light" OR "quantum emitter" OR "giant atom" OR optomechanical'''

[pools.C]
label = "Foundations of quantum mechanics"
categories = ["quant-ph", "physics.hist-ph"]
query = '''abs:"foundations of quantum" OR abs:"quantum foundations" OR abs:"interpretation of quantum" OR abs:"interpretations of quantum" OR abs:"measurement problem" OR abs:"Wigner's friend" OR abs:"Born rule" OR abs:"Bohmian" OR abs:"pilot wave" OR abs:"de Broglie-Bohm" OR abs:"many-worlds" OR abs:Everett OR abs:QBism OR abs:"relational quantum" OR abs:"objective collapse" OR abs:"collapse model" OR abs:"wave function collapse" OR abs:"wavefunction collapse" OR abs:"hidden variable" OR abs:"ontological model" OR abs:"psi-epistemic" OR abs:contextuality OR abs:"Kochen-Specker" OR abs:"Bell nonlocality" OR abs:"Leggett-Garg" OR abs:macrorealism OR abs:"generalized probabilistic theor" OR abs:"general probabilistic theor" OR abs:"reconstruction of quantum" OR abs:"quantum Darwinism" OR abs:"quantum-to-classical transition" OR abs:"indefinite causal order" OR abs:"quantum reference frame"'''
backup_query = '''"foundations of quantum mechanics" OR "interpretation of quantum mechanics" OR "measurement problem" OR "Wigner's friend" OR "Born rule" OR "Bohmian mechanics" OR "many-worlds" OR QBism OR "collapse model" OR contextuality OR "Leggett-Garg" OR "quantum Darwinism"'''
